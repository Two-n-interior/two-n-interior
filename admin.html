<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>จัดการผลงาน | two n interior</title>
<link rel="icon" type="image/png" sizes="16x16" href="images/image-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/image-32.png">
<link rel="apple-touch-icon" sizes="192x192" href="images/image-192.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- ===== Login screen ===== -->
<div class="admin-login" id="loginScreen">
  <div class="admin-login__box">
    <img src="images/two-n-ninterior-transparent.png" alt="two n interior">
    <h1>เข้าสู่ระบบหลังบ้าน</h1>
    <form id="loginForm">
      <div class="admin-field">
        <label for="loginEmail">อีเมล</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="admin-field">
        <label for="loginPassword">รหัสผ่าน</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="admin-btn admin-btn--dark" id="loginSubmit">เข้าสู่ระบบ</button>
      <p class="admin-error" id="loginError"></p>
    </form>
  </div>
</div>

<!-- ===== Dashboard ===== -->
<div id="dashboard" hidden>
  <header class="admin-header">
    <div class="admin-header__logo">
      <a href="index.html" class="admin-header__logo-badge" aria-label="กลับไปหน้าเว็บ">
        <img src="images/two-n-ninterior.png" alt="two n interior">
      </a>
      ระบบจัดการผลงาน
    </div>
    <div class="admin-header__user">
      <span id="userEmailLabel"></span>
      <button type="button" id="logoutBtn">ออกจากระบบ</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <div>
        <h1>ผลงานทั้งหมด</h1>
        <p>เพิ่ม แก้ไข หรือลบผลงานที่จะแสดงในหน้าเว็บ (อัปเดตทันทีทั้งเว็บไทยและอังกฤษ)</p>
      </div>
      <button type="button" class="admin-btn admin-btn--gold" id="addProjectBtn">+ เพิ่มผลงานใหม่</button>
    </div>

    <div class="admin-filters" id="categoryFilters">
      <button type="button" class="admin-filter is-active" data-filter="all">ทั้งหมด</button>
      <button type="button" class="admin-filter" data-filter="construction">รับเหมาก่อสร้าง/ต่อเติม</button>
      <button type="button" class="admin-filter" data-filter="interior">ตกแต่งภายใน</button>
      <button type="button" class="admin-filter" data-filter="furniture">เฟอร์นิเจอร์ Built-in</button>
      <button type="button" class="admin-filter" data-filter="garden">จัดสวน</button>
      <button type="button" class="admin-filter" data-filter="design">ออกแบบ</button>
    </div>

    <div id="listLoading" class="admin-loading">กำลังโหลดข้อมูล...</div>
    <div class="admin-list" id="projectList"></div>
    <div class="admin-empty" id="emptyState" hidden>ยังไม่มีผลงาน กดปุ่ม "+ เพิ่มผลงานใหม่" เพื่อเริ่มเพิ่มข้อมูล</div>
  </main>
</div>

<!-- ===== Add / Edit modal ===== -->
<div class="admin-modal" id="formModal" hidden>
  <div class="admin-modal__backdrop" id="formModalBackdrop"></div>
  <div class="admin-modal__dialog">
    <button type="button" class="admin-modal__close" id="formModalClose">✕</button>
    <h2 id="formModalTitle">เพิ่มผลงานใหม่</h2>
    <form id="projectForm">
      <input type="hidden" id="projectId">

      <div class="admin-grid-2" style="margin-bottom:16px;">
        <div class="admin-field">
          <label for="fieldCategory">หมวดหมู่</label>
          <select id="fieldCategory" required>
            <option value="construction">รับเหมาก่อสร้าง/ต่อเติม</option>
            <option value="interior">ตกแต่งภายใน</option>
            <option value="furniture">เฟอร์นิเจอร์ Built-in</option>
            <option value="garden">จัดสวน</option>
            <option value="design">ออกแบบ (แบบเสนองาน/คอนเซปต์)</option>
          </select>
        </div>
        <div class="admin-field">
          <label for="fieldYear">ปี (ค.ศ.)</label>
          <input type="number" id="fieldYear" min="2000" max="2100" required>
        </div>
      </div>

      <div class="admin-field">
        <label>รูปภาพผลงาน (รูปแรก = รูปหน้าปก)</label>
        <div class="admin-images" id="imageList"></div>
        <label class="admin-upload-box" id="uploadBox">
          + อัปโหลดรูปภาพ (เลือกได้หลายรูป)
          <input type="file" id="imageInput" accept="image/*" multiple>
        </label>
      </div>

      <div class="admin-grid-2">
        <div class="admin-lang-col">
          <h4>ภาษาไทย</h4>
          <div class="admin-field">
            <label for="fieldTitleTh">ชื่อโครงการ</label>
            <input type="text" id="fieldTitleTh" required>
          </div>
          <div class="admin-field">
            <label for="fieldLocationTh">ที่ตั้ง</label>
            <input type="text" id="fieldLocationTh" required>
          </div>
          <div class="admin-field">
            <label for="fieldAreaTh">พื้นที่</label>
            <input type="text" id="fieldAreaTh" placeholder="เช่น 280 ตร.ม." required>
          </div>
          <div class="admin-field">
            <label for="fieldDurationTh">ระยะเวลาส่งมอบ</label>
            <input type="text" id="fieldDurationTh" placeholder="เช่น 60 วัน" required>
          </div>
          <div class="admin-field">
            <label for="fieldTypeTh">ประเภทงาน</label>
            <input type="text" id="fieldTypeTh" placeholder="เช่น บ้านเดี่ยว" required>
          </div>
          <div class="admin-field">
            <label for="fieldDescTh">รายละเอียด</label>
            <textarea id="fieldDescTh" required></textarea>
          </div>
          <div class="admin-field">
            <label for="fieldSpecsTh">จุดเด่น/สเปค (บรรทัดละ 1 รายการ)</label>
            <textarea id="fieldSpecsTh" placeholder="วัสดุ...&#10;ระบบไฟ...&#10;เฟอร์นิเจอร์..."></textarea>
          </div>
        </div>

        <div class="admin-lang-col">
          <h4>English (ไม่บังคับ)</h4>
          <div class="admin-field">
            <label for="fieldTitleEn">Title</label>
            <input type="text" id="fieldTitleEn">
          </div>
          <div class="admin-field">
            <label for="fieldLocationEn">Location</label>
            <input type="text" id="fieldLocationEn">
          </div>
          <div class="admin-field">
            <label for="fieldAreaEn">Area</label>
            <input type="text" id="fieldAreaEn" placeholder="e.g. 280 sq.m.">
          </div>
          <div class="admin-field">
            <label for="fieldDurationEn">Duration</label>
            <input type="text" id="fieldDurationEn" placeholder="e.g. 60 days">
          </div>
          <div class="admin-field">
            <label for="fieldTypeEn">Project Type</label>
            <input type="text" id="fieldTypeEn" placeholder="e.g. Single House">
          </div>
          <div class="admin-field">
            <label for="fieldDescEn">Description</label>
            <textarea id="fieldDescEn"></textarea>
          </div>
          <div class="admin-field">
            <label for="fieldSpecsEn">Highlights/Specs (one per line)</label>
            <textarea id="fieldSpecsEn"></textarea>
          </div>
        </div>
      </div>

      <p class="admin-error" id="formError"></p>

      <div class="admin-modal__actions">
        <button type="button" class="admin-btn admin-btn--outline" id="formCancelBtn">ยกเลิก</button>
        <button type="submit" class="admin-btn admin-btn--dark" id="formSubmitBtn">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<div class="admin-toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
